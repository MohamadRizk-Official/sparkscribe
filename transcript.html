<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="SparkScribe" />
    <title>Transcript — SparkScribe</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playpen+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div>
    </div>

    <header class="topbar">
      <!-- sparkscribe:brand -->
      <div class="topbar-right"><div id="accountSlot"></div></div>
    </header>

    <main class="app">
      <a class="back-link" href="/library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Library</a>

      <section class="res-head ws-head" id="detailHead">
        <div class="res-title">
          <div class="title-row">
            <h1 id="tTitle" class="ws-title">Loading…</h1>
            <button class="icon-btn ws-rename" id="renameBtn" type="button" title="Rename (or double-click the title)" aria-label="Rename this recording" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg></button>
          </div>
          <div class="meta-chips ws-meta" id="tMeta"></div>
          <div class="rec-folders" id="tFolders"></div>
          <div class="related-slot" id="relatedResult" hidden></div>
        </div>
        <div class="res-actions ws-actions hidden" id="tActions">
          <button class="btn btn-primary ws-play" id="audioBtn" type="button" hidden></button>
          <input type="file" id="attachInput" accept="audio/*,video/*,.m4a,.mp3,.mp4,.wav,.ogg,.opus,.webm,.aac,.flac,.mov" hidden />
          <button class="icon-btn ws-icon star-btn" id="favBtn" type="button" aria-pressed="false" aria-label="Add to favorites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9Z"/></svg><span class="sr-only">Favorite</span></button>
          <button class="btn ws-btn" id="foldersBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>Course</span></button>
          <button class="icon-btn ws-icon" id="copyBtn" type="button" title="Copy the transcript" aria-label="Copy the transcript"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg></button>
          <button class="btn ws-btn" id="exportBtn" type="button" title="PDF, Word, Markdown, text or subtitles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span>Export</span></button>
          <div class="ws-more">
            <button class="icon-btn ws-icon" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More actions" title="More"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
            <div class="ws-menu" id="moreMenu" role="menu" hidden>
              <button type="button" role="menuitem" class="danger" id="deleteBtn">Delete recording…</button>
            </div>
          </div>
        </div>
      </section>

      <nav id="resTabs" aria-label="Result views"></nav>

      <section class="panel transcript-card" id="transcriptCard">
        <div class="view-toggle" role="group" aria-label="Transcript view" id="viewToggle">
          <button type="button" class="on" data-view="original" aria-pressed="true" title="Exactly as transcribed">Original</button>
          <button type="button" data-view="clean" aria-pressed="false" title="Easier to read: hesitations (um, uh) and repeated words removed. The original is kept.">Clean</button>
        </div>
        <div class="transcript" id="transcript"><div class="lib-skel"></div><div class="lib-skel"></div></div>
      </section>

      <div id="insightsHost" class="insights-host"></div>
    </main>

    <div class="playerbar attach-bar hidden" id="attachBar" role="region" aria-label="Audio player">
      <audio id="attachPlayer" preload="metadata"></audio>
      <button class="pb-btn" data-pb="back" type="button" title="Back 10 s (←)" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" stroke="none" fill="currentColor">10</text></svg></button>
      <button class="pb-play" data-pb="play" type="button" title="Play (space)" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button class="pb-btn" data-pb="fwd" type="button" title="Forward 10 s (→)" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" stroke="none" fill="currentColor">10</text></svg></button>
      <span class="pb-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="pb-time" data-pb="time">0:00 / 0:00</span>
      <input type="range" class="pb-seek" data-pb="seek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
      <div class="pb-vol">
        <button class="pb-btn" data-pb="mute" type="button" aria-label="Mute"></button>
        <input type="range" class="pb-volume" data-pb="vol" min="0" max="100" value="100" step="1" aria-label="Playback volume" />
      </div>
      <button class="pb-chip" id="attachSpeed" data-pb="speed" type="button">1×</button>
      <button class="pb-chip on" id="attachFollow" type="button" title="Follow: keeps the line being played in view. Scroll by hand and it pauses for a moment." aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m0 0-5-5m5 5 5-5"/></svg><span>Follow</span></button>
      <button class="icon-btn pb-close" id="attachClose" type="button" title="Hide player" aria-label="Hide player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <script type="module" src="/src/pages/transcript.js"></script>
  </body>
</html>
