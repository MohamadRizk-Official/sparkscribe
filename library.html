<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex" />
    <meta name="application-name" content="SparkScribe" />
    <title>Library — SparkScribe</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-grid"></div><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div>
    </div>

    <header class="topbar">
      <!-- sparkscribe:brand -->
      <div class="topbar-right"><div id="accountSlot"></div></div>
    </header>

    <main class="app lib-app">
      <section class="lib-head">
        <div class="lib-head-text">
          <h1 class="page-title">Your Library</h1>
          <p class="lib-sub">Everything you’ve recorded, organized in one place.</p>
          <p class="lib-stats" id="libStats">&nbsp;</p>
        </div>
        <div class="lib-head-actions">
          <button class="btn lib-across" type="button" id="acrossBtn" title="Ask one question across several recordings, or make one study guide from them"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.3 8.2 15.7 11M8.3 15.8l7.4-2.8"/></svg><span>Ask across recordings</span><span class="thunder-mark" id="acrossTag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2.5 5.5 13.4h5.2l-1.4 8.1 7.7-11h-5.2z"/></svg><span>Thunder</span><i class="tm-arc" aria-hidden="true"></i></span></button>
        </div>
      </section>

      <form class="lib-search" role="search" id="searchForm" autocomplete="off">
        <svg class="lib-search-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" maxlength="200" placeholder="Search titles, transcripts, speakers and notes" title="Searches titles, transcripts, speaker names and Notes" enterkeyhint="search" aria-label="Search your library" aria-keyshortcuts="/" />
        <kbd class="lib-kbd" aria-hidden="true">/</kbd>
        <button type="button" class="lib-search-clear" id="qClear" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </form>

      <nav class="tabs lib-views" id="viewTabs" role="tablist" aria-label="Library views">
        <button class="tab" type="button" role="tab" data-view="recent">Recent</button>
        <button class="tab" type="button" role="tab" data-view="all">All</button>
        <button class="tab" type="button" role="tab" data-view="favorites">Favorites</button>
        <button class="tab" type="button" role="tab" data-view="folders">Courses</button>
        <span class="tab-ind" aria-hidden="true"></span>
      </nav>

      <div class="folder-head" id="folderHead" hidden></div>

      <div class="lib-toolbar" id="toolbar">
        <div class="type-filter" id="typeChips" role="group" aria-label="Recording type"></div>
        <div class="lib-controls">
          <select id="dateSel" class="lib-select" aria-label="Date">
            <option value="">Any time</option>
            <option value="7">Past 7 days</option>
            <option value="30">Past 30 days</option>
            <option value="365">Past year</option>
          </select>
          <select id="sortSel" class="lib-select" aria-label="Sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="longest">Longest</option>
            <option value="shortest">Shortest</option>
            <option value="az">A–Z</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="selectBtn" type="button" aria-pressed="false">Select</button>
        </div>
      </div>

      <section class="lib-list" id="libList" aria-live="polite">
        <div class="lib-skel"></div><div class="lib-skel"></div><div class="lib-skel"></div>
      </section>
      <div class="lib-more" id="libMore"></div>
    </main>
    <!-- sparkscribe:legal -->

    <div class="bulk-bar" id="bulkBar" hidden>
      <span class="bulk-count" id="bulkCount">0 selected</span>
      <button class="btn btn-primary btn-sm" type="button" data-bulk="across" title="Ask one question across the selected recordings">Ask across</button>
      <button class="btn btn-ghost btn-sm" type="button" data-bulk="across-guide" title="One study guide from the selected recordings">Study guide</button>
      <button class="btn btn-ghost btn-sm" type="button" data-bulk="favorite">Favorite</button>
      <button class="btn btn-ghost btn-sm" type="button" data-bulk="folder">Course</button>
      <button class="btn btn-danger btn-sm" type="button" data-bulk="delete">Delete</button>
      <button class="icon-btn" type="button" data-bulk="cancel" aria-label="Stop selecting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <script type="module" src="/src/pages/library.js"></script>
  </body>
</html>
